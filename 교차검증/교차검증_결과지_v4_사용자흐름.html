<!DOCTYPE html>
<!-- saved from url=(0060)https://center.muhayu.com/file/down/6a4fd34fd1a2dd5d6372029c -->
<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교차검증 결과지</title>
<style>
  :root{
    --ink:#151d2b; --ink-soft:#5b6577; --line:#e6eaf0; --line-strong:#ccd4e0;
    --paper:#fff; --band:#f1f3f7; --navy:#0f2033; --navy-soft:#eef2f8;
    /* PDF 팔레트 (몬x역 교차진단) */
    --c-verify:#1e9e4a; --c-verify-bg:#e4f6ea;   /* 검증된/역량 신뢰 = 그린 */
    --c-deep:#ff006b;   --c-deep-bg:#ffe3ef;      /* 집중 점검/하등급 = 핑크 */
    --c-explore:#704ad9;--c-explore-bg:#efe9fb;   /* 심층 탐색/집중 탐색 = 퍼플 */
    --c-blue:#0075ff;   --c-blue-bg:#e6f0ff;      /* 브랜드/상등급/검증 헤더 = 블루 */
    --c-blue-mid:#66abff;                         /* 중등급 = 미드 블루 */
    --c-weak:#9a7b12;   --c-weak-bg:#f7f0d9;      /* 취약한 = 앰버 */
    --c-etc:#6a7385;    --c-etc-bg:#eef0f4;       /* 기타 = 그레이 */
    --c-scen:#704ad9;   --c-scen-bg:#efe9fb;      /* 시나리오/탐색 = 퍼플 */
    --core-hl:#fdf6d5;                            /* 핵심역량 강조 = 연노랑 */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:#d9dde4;color:var(--ink);font-size:11px;line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:24px 0;}
  .page{width:794px;min-height:1123px;background:var(--paper);margin:0 auto 26px;
    padding:38px 44px 46px;position:relative;box-shadow:0 4px 20px rgba(30,40,60,.14);}

  /* 헤더/푸터 */
  .doc-top{display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:9px;border-bottom:2px solid var(--navy);margin-bottom:18px;}
  .doc-top h1{font-size:13.5px;font-weight:800;letter-spacing:-.01em;color:var(--navy);}
  .doc-top .cand{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .doc-top .cand b{color:var(--ink);font-weight:800;}
  .foot{position:absolute;left:44px;right:44px;bottom:16px;display:flex;
    justify-content:space-between;align-items:center;font-size:8.5px;color:#aab0bc;
    border-top:1px solid var(--line);padding-top:7px;}
  .foot .brand{font-weight:800;letter-spacing:.04em;color:#7b8494;}
  .foot .brand span{color:var(--c-blue);}
  .foot-c{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;line-height:1.35;}
  .foot-ip{font-size:7.5px;color:#b3b9c4;}
  .eyebrow{font-size:8.5px;font-weight:800;letter-spacing:.14em;color:var(--c-blue);
    text-transform:uppercase;margin-bottom:3px;}
  .sec-title{font-size:12.5px;font-weight:800;color:var(--navy);
    display:flex;align-items:center;gap:7px;margin:18px 0 9px;}
  .sec-title::before{content:"";width:3px;height:14px;background:#939395;border-radius:2px;}
  .sec-title .tag{margin-left:auto;font-size:9px;font-weight:600;color:var(--ink-soft);
    background:var(--band);padding:3px 9px;border-radius:20px;}

  /* 헤더 카드 */
  /* 1페이지 상단: 네이비 배경 컨테이너 (PDF 톤) */
  .hero-wrap{background:#495e76;border-radius:14px;padding:15px 15px 13px;margin-bottom:14px;}
  .hero-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 7px 12px;}
  .hero-head h1{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.01em;}
  .hero-head .hh-right{font-size:10px;font-weight:700;color:#cfd8e4;white-space:nowrap;}
  .hero{border:none;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(15,25,45,.18);}
  .hero-main{display:grid;grid-template-columns:1fr 2.4fr 1.3fr;background:linear-gradient(90deg,#ffffff 0%,#ecf4ff 46%,#ffffff 84%);}
  .hero-cell{padding:15px 18px;border-right:1px solid var(--line);}
  .hero-cell:last-child{border-right:none;}
  .hero-role{font-size:9px;color:var(--ink-soft);font-weight:700;letter-spacing:.03em;}
  .hero-name{font-size:23px;font-weight:800;color:var(--navy);margin:2px 0 1px;letter-spacing:-.02em;}
  .hero-id{font-size:9px;color:#9aa1ad;font-weight:600;letter-spacing:.06em;}
  .src-row{display:flex;align-items:center;justify-content:space-between;margin-top:7px;}
  .src-row+.src-row{margin-top:5px;}
  .src-label{font-size:9.5px;font-weight:700;color:var(--ink);}
  .pill{font-size:8.5px;font-weight:800;padding:3px 10px;border-radius:20px;}
  .pill.ok{background:#fff;color:var(--c-blue);border:1px solid var(--c-blue);}
  .pill.warn{background:#fff;color:var(--c-weak);border:1px solid #d9c98c;}
  .pill.no{background:#fff;color:var(--c-deep);border:1px solid #ffb0d0;}
  .hero-mid{display:flex;gap:18px;align-items:center;}
  .hero-mid .src-col{flex:none;}
  .hero-mid .src-row{justify-content:flex-start;gap:9px;margin-top:0;}
  .hero-mid .src-row+.src-row{margin-top:6px;}
  .hero-mid .src-label{min-width:50px;}
  .hero-mid .src-note{flex:1;font-size:9px;color:var(--ink-soft);line-height:1.55;}
  .hero-mid .src-note b{color:var(--c-blue);font-weight:700;}
  .hero-type-label{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--c-blue);text-transform:uppercase;}
  .hero-type{font-size:18px;font-weight:800;color:var(--navy);margin:3px 0 6px;letter-spacing:-.02em;}
  .hero-type-desc{font-size:9.5px;color:var(--ink-soft);line-height:1.55;}
  .hero-note{background:var(--navy-soft);padding:9px 18px;font-size:9px;color:var(--ink-soft);
    display:flex;gap:14px;align-items:center;border-top:1px solid var(--line);}
  .hero-note b{color:var(--navy);font-weight:800;white-space:nowrap;}
  .chk-list{display:flex;gap:6px;flex-wrap:wrap;}
  .chk{font-size:8.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:#fff;
    border:1px solid var(--line-strong);color:var(--ink);}

  /* 가이드 박스 */
  .guide{background:var(--band);border:1px dashed var(--line-strong);border-radius:9px;
    padding:8px 13px;margin:8px 0 10px;font-size:9px;color:var(--ink-soft);line-height:1.5;}
  .guide b{color:var(--navy);}

  /* 검증 결과 요약 — 색 블록 그리드 */
  .summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:4px 0 4px;}
  .sm-card{border:1px solid var(--line);border-radius:10px;padding:13px 12px 11px;position:relative;overflow:hidden;background:#fff;}
  .sm-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;}
  .sm-card .sm-k{font-size:9.5px;font-weight:800;color:var(--ink);}
  .sm-card .sm-sub{font-size:7.5px;font-weight:600;color:var(--ink-soft);margin-top:1px;}
  .sm-card .sm-v{font-size:25px;font-weight:800;line-height:1;margin-top:10px;letter-spacing:-.02em;}
  .sm-card .sm-v small{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .sm-card .sm-gauge{height:5px;background:#eef1f6;border-radius:3px;overflow:hidden;margin-top:9px;}
  .sm-card .sm-gauge span{display:block;height:100%;border-radius:3px;}
  .sm-card .sm-n{font-size:8px;font-weight:600;color:#9aa1ad;margin-top:6px;}
  .sm-deep::before{background:var(--c-deep);} .sm-deep .sm-v{color:var(--c-deep);}
  .sm-explore::before{background:var(--c-explore);} .sm-explore .sm-v{color:var(--c-explore);}
  .sm-verify::before{background:var(--c-verify);} .sm-verify .sm-v{color:var(--c-verify);}
  .sm-weak::before{background:var(--c-weak);} .sm-weak .sm-v{color:var(--c-weak);}
  .sm-etc::before{background:#7b8494;} .sm-etc .sm-v{color:#7b8494;}
  .sm-bar{display:none;}

  /* 매트릭스 */
  table{width:100%;border-collapse:collapse;font-size:9.5px;}
  .mtx th{background:var(--band);color:var(--navy);font-weight:800;font-size:9px;padding:7px 8px;text-align:left;border-bottom:2px solid var(--line-strong);}
  .mtx th:nth-child(n+3){text-align:center;}
  .mtx td{padding:5px 8px;border-bottom:1px solid var(--line);}
  .mtx td.col-c{text-align:center;}
  .mtx tr:last-child td{border-bottom:none;}
  .grp-cell{font-weight:800;color:var(--navy);font-size:9px;background:var(--band);
    vertical-align:middle;width:56px;text-align:center;}
  .cap-name{font-weight:600;}
  .g{font-weight:800;font-size:10px;}
  .g-H{color:var(--navy);} .g-M{color:var(--ink-soft);} .g-L{color:var(--c-deep);} .g-N{color:#9aa1ad;}
  .lab{display:inline-block;font-size:8.5px;font-weight:800;padding:2px 9px;border-radius:20px;min-width:78px;}
  .lab-verify{background:#fff;color:var(--c-verify);border:1px solid #a5dcb8;}
  .lab-deep{background:#fff;color:var(--c-deep);border:1px solid #ffb0d0;}
  .lab-explore{background:#fff;color:var(--c-explore);border:1px solid #cdb8f0;}
  .lab-weak{background:#fff;color:var(--c-weak);border:1px solid #ddc98f;}
  .lab-etc{background:#fff;color:var(--c-etc);border:1px solid #ccd2db;}
  .lab-check{background:#fff;color:#F09000;border:1px solid #f6cd93;}
  /* 카테고리 칩 (핵심역량·집중점검 라벨 — 섹션 헤더 바 색과 통일) */
  .catchip{display:inline-block;font-size:8.5px;font-weight:800;padding:2px 10px;border-radius:20px;border:1px solid transparent;white-space:nowrap;}
  .cat-verify{background:var(--c-blue-bg);color:var(--c-blue);border-color:#a9cbf5;}
  .cat-deep{background:var(--c-deep-bg);color:var(--c-deep);border-color:#ffbdd7;}
  .cat-explore{background:var(--c-explore-bg);color:var(--c-explore);border-color:#d0bdf0;}
  .cat-weak{background:#eef1f6;color:#57616f;border-color:#cbd3de;}
  .cat-etc{background:var(--c-etc-bg);color:#57616f;border-color:#cdd3dd;}
  .core-row td:not(.grp-cell){background:var(--core-hl);}
  .core-badge{font-size:7.5px;font-weight:800;color:var(--c-weak);background:var(--c-weak-bg);
    padding:1px 5px;border-radius:4px;margin-left:5px;}
  .core-star{color:var(--c-weak);margin-left:3px;}
  .core-tag{display:inline-block;font-size:7.5px;font-weight:800;color:var(--c-weak);
    background:var(--c-weak-bg);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;}

  /* 체크포인트 */
  .cp-block{margin-bottom:13px;}
  .cp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 13px;border-radius:8px 8px 0 0;
    font-weight:800;font-size:11.5px;}
  .cp-head .cph-cond{font-size:9px;font-weight:600;opacity:.9;}
  .cp-head .cph-cond b{font-weight:800;}
  .cp-head.deep{background:var(--c-deep-bg);color:var(--c-deep);}
  .cp-head.explore{background:var(--c-explore-bg);color:var(--c-explore);}
  .cp-head.verify{background:var(--c-verify-bg);color:var(--c-verify);}
  .cp-head.weak{background:var(--c-weak-bg);color:var(--c-weak);}
  .cp-body{border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;}
  .cp-desc{font-size:8.5px;color:var(--ink-soft);padding:7px 12px 6px;border-bottom:1px dashed var(--line);line-height:1.55;}
  .cp-item{padding:8px 12px;border-bottom:1px solid var(--line);}
  .cp-item:last-child{border-bottom:none;}
  .cp-block.tight .cp-item{padding:6px 12px;}
  .cn{font-size:10px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .grade-mini{font-size:8px;font-weight:700;color:var(--ink-soft);}
  .grade-mini em{font-style:normal;font-weight:800;}
  .vuln{font-size:8.5px;color:var(--ink);background:var(--band);border-radius:6px;
    padding:7px 10px;margin-top:5px;line-height:1.55;}
  .vuln-lb{font-weight:800;color:var(--ink-soft);margin-right:2px;white-space:nowrap;}
  .vuln-lb::after{content:' |';color:var(--line-strong);font-weight:600;}
  .vuln-txt{display:inline;}
  .st{font-size:7px;font-weight:800;padding:1px 6px;border-radius:4px;margin-right:5px;white-space:nowrap;}
  .st-강{background:var(--c-deep);color:#fff;}
  .st-중{background:var(--c-weak-bg);color:var(--c-weak);}
  .st-약{background:var(--c-etc-bg);color:var(--c-etc);}
  .q{font-size:9px;color:var(--ink);margin-top:5px;line-height:1.5;}
  .qtag{font-size:7px;font-weight:800;padding:1px 5px;border-radius:4px;margin-right:6px;vertical-align:middle;}
  .qtag-deep,.qtag-explore,.qtag-scen,.qtag-value,.qtag-attitude{background:#eef0f4;color:#5b6577;}
  .q-aim{font-size:7.5px;color:var(--ink-soft);margin-left:6px;font-weight:600;}
  .cmt{font-size:9px;color:var(--ink-soft);margin-top:4px;line-height:1.55;}

  /* 분류 카드 (3p) */
  .cls-block{margin-bottom:11px;}
  /* 섹션 카테고리 바 (PDF 톤: 아이콘 + 제목 + 우측 등급조건) */
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-radius:9px;padding:9px 14px;margin-bottom:8px;border:1px solid transparent;}
  .sh-left{display:flex;align-items:center;gap:9px;}
  .sh-icon{width:22px;height:22px;border-radius:50%;background:#fff;flex:none;
    display:grid;place-items:center;box-shadow:0 1px 2px rgba(20,30,50,.13);}
  .sh-icon svg{width:13px;height:13px;display:block;}
  .sh-title{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:-.01em;}
  .sh-right{font-size:9px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .sec-head.v-deep{background:var(--c-deep-bg);border-color:#ffd0e2;}
  .sec-head.v-deep .sh-icon{color:var(--c-deep);}
  .sec-head.v-explore{background:var(--c-explore-bg);border-color:#ddd0f5;}
  .sec-head.v-explore .sh-icon{color:var(--c-explore);}
  .sec-head.v-verify{background:var(--c-blue-bg);border-color:#a9cbf5;}
  .sec-head.v-verify .sh-icon{color:var(--c-blue);}
  .sec-head.v-weak{background:#eef1f6;border-color:#ccd4de;}
  .sec-head.v-weak .sh-icon{color:#5b6577;}
  .sec-head.v-etc{background:var(--c-etc-bg);border-color:#ccd3dd;}
  .sec-head.v-etc .sh-icon{color:#5b6577;}
  .ch-pill{display:inline-block;font-size:8.5px;font-weight:800;border-radius:50%;
    width:18px;height:18px;line-height:17px;text-align:center;background:#fff;border:1px solid var(--line-strong);}
  .ch-H,.ch-M,.ch-L,.ch-N{color:var(--navy);}
  .cls-head{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;margin-bottom:5px;}
  .cls-head .icon{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;
    font-size:9px;color:#fff;font-weight:800;}
  .cls-head .cnt{margin-left:auto;font-size:8.5px;font-weight:700;color:var(--ink-soft);
    background:var(--band);padding:2px 9px;border-radius:20px;}
  .cls-desc{font-size:8.5px;color:var(--ink-soft);margin-bottom:6px;line-height:1.55;}
  .cap-grid{display:grid;grid-template-columns:1fr;gap:0;}
  .cap-card{padding:9px 4px;border-bottom:1px solid var(--line);
    display:flex;gap:14px;align-items:center;}
  .cap-card:last-child{border-bottom:none;}
  .cap-card .ccn{display:flex;align-items:center;gap:6px;flex:none;}
  .cap-card .ccn .namepill{font-size:9.5px;font-weight:800;color:var(--ink);background:var(--band);border-radius:7px;padding:6px 12px;min-width:120px;text-align:center;}
  .cap-card .ccc{flex:1;font-size:9px;color:var(--ink-soft);line-height:1.55;}
  .cap-card .corebadge{flex:none;margin-left:0;margin-right:8px;}
  .cap-inline{display:flex;flex-wrap:wrap;gap:6px;}
  .cap-chip{border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:8.5px;
    display:flex;align-items:center;gap:6px;}
  .cap-chip .ccn{font-weight:800;color:var(--ink);}
  .cap-chip .ccg{font-size:7.5px;font-weight:700;color:var(--ink-soft);}
  .next-box{background:var(--navy);color:#fff;border-radius:10px;padding:13px 16px;margin-top:8px;}
  /* 기타 역량 (업로드 디자인 참고: 역량명 pill + AI 인터뷰/역량검사 등급 배지, 2열) */
  .etc-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;}
  .etc-row{display:flex;align-items:center;gap:7px;}
  .etc-row.is-core{background:var(--core-hl);border-radius:8px;padding:3px 8px;}
  .etc-row .corebadge{margin-left:auto;}
  .etc-name{flex:none;min-width:96px;font-size:9px;font-weight:700;color:var(--ink);
    background:var(--band);border-radius:7px;padding:6px 10px;text-align:center;}
  .etc-src{font-size:8px;font-weight:600;color:var(--ink-soft);}
  .gpill{display:inline-block;font-size:8px;font-weight:800;border-radius:5px;padding:2px 7px;min-width:20px;text-align:center;}
  .gpill-H{background:#0075ff;color:#fff;}
  .gpill-M{background:rgba(0,117,255,.6);color:#fff;}
  .gpill-L{background:#ff006b;color:#fff;}
  .gpill-N{background:#e9e9ea;color:#7d7d80;}
  .next-box .nl{font-size:8.5px;font-weight:800;letter-spacing:.1em;opacity:.7;text-transform:uppercase;}
  .next-box .nt{font-size:11px;font-weight:700;margin-top:4px;line-height:1.5;}

  /* 고객사 핵심 역량 풀세트 카드 */
  /* 고객사 핵심 역량 2단 카드 (좌: 라벨·역량명·설명 / 우: 질문·근거) */
  .core-item{border:1px solid var(--line);border-radius:9px;
    padding:11px 14px;margin-bottom:8px;}
  /* 상단 헤더: 라벨+역량명(좌) / 게이지(우) 가로 배치 */
  .core-top{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .core-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .core-cap{font-size:13px;font-weight:800;color:var(--ink);}
  .core-gauge{display:flex;gap:16px;flex:none;}
  .cg-item{display:flex;align-items:center;gap:6px;}
  .gg-row{display:flex;align-items:center;gap:6px;}
  .gg-lb{font-size:8px;font-weight:700;color:var(--ink-soft);flex:none;}
  .gg-track{display:flex;gap:2px;width:52px;}
  .gg-cell{height:7px;flex:1;background:#eef1f6;border-radius:2px;}
  .gg-val{font-size:9px;font-weight:800;flex:none;}
  /* 본문: 설명 + 근거/질문 전체 폭 */
  .core-desc{font-size:8.5px;color:var(--ink-soft);line-height:1.55;margin-top:9px;padding-bottom:8px;border-bottom:1px dashed var(--line);}
  .core-body{margin-top:8px;}
  .core-body .q{margin-top:4px;}
  .core-body .vuln{margin-top:0;margin-bottom:6px;}
  .core-body .cmt{margin-top:0;}

  /* 검증/취약 2단 세로 카드 (핵심역량과 한 페이지에 넣기 위한 압축) */
  .cap-card-v{display:none;}
  .corechip{font-size:7.5px;font-weight:800;color:var(--c-scen);background:#fff;border:1px solid #d9cef2;border-radius:5px;padding:1px 6px;margin-left:1px;}

/* ---------------- 계산 ---------------- */
function compute(data){
  const cnt={HH:0,HM:0,HL:0,MH:0,MM:0,ML:0,LH:0,LM:0,LL:0,NH:0,NM:0,NL:0};
  const rows=[];
  CAPS.forEach(c=>{
    const [iv,tv]=data[c.name]||['N','N'];
    const cd=iv+tv; cnt[cd]++;
    rows.push({...c,iv,tv,code:cd,pat:PATTERN[cd],cls:classOf(cd),core:CORE.includes(c.name)});
  });
  const OBS=23-(cnt.NM+cnt.NL);
  const pct=n=>OBS>0?Math.round(n/OBS*100):0;
  const STR=pct(cnt.HH), LAT=pct(cnt.LH+cnt.NH), MNT=pct(cnt.HL), WK=pct(cnt.LL);
  const ETC=pct(cnt.HM+cnt.MH+cnt.MM+cnt.ML+cnt.LM);
  let type; const N3=cnt.NH+cnt.NM+cnt.NL;
  if(N3>=10) type='역량 미확인형';
  else if(WK>25) type='보완 필요형';
  else if(STR>=45&&WK<=10&&MNT<35) type='핵심 인재형';
  else if(MNT>=35&&STR<=30) type='자기 PR형';
  else if(LAT>=30&&STR>=25&&MNT<35) type='숨은 실력자형';
  else if((cnt.HH+cnt.HM)>=8&&WK<=15) type='실무 강점형';
  else if(LAT>=25&&STR<25) type='발전 가능형';
  else type='안정적 균형형';
  return {cnt,rows,OBS,STR,LAT,MNT,WK,ETC,type};
}

  'default':{good:'구체적인 상황·행동·근거를 들어 설명하고 결과까지 연결해 답한다.',poor:'추상적이거나 일반론에 그쳐 구체적 근거를 제시하지 못한다.'},

function ansBoxes(q,tag){
  const a=ANS[q]||ANS_MORE[q]||ANS_FALLBACK[tag]||ANS_FALLBACK['default'];
  if(!a) return '';
  return `<div class="ans"><div class="ans-row"><span class="ans-lb good">바람직한 답변</span><span class="ans-tx">${a.good}</span></div><div class="ans-row"><span class="ans-lb poor">부족한 답변</span><span class="ans-tx">${a.poor}</span></div></div>`;
}
function deepQA(r){
  const qs=Q_DEEP[r.name]||[['실제 실행 과정을 단계별로 구체적으로 말씀해 주세요.','경험 검증'],['다시 판단한다면 무엇을 다르게 하시겠어요?','자기 인식']];
  const dTag={'경험 검증':'qtag-deep','자기 인식':'qtag-attitude'};
  return qs.map(q=>`<div class="q"><span class="qtag ${dTag[q[1]]||'qtag-deep'}">${q[1]}</span>${q[0]}</div>${ansBoxes(q[0],q[1])}`).join('');
}
function exploreQA(r){
  const qs=Q_EXPLORE[r.name]||[['해당 역량에 대한 본인의 생각을 말씀해 주세요.','의지·태도'],['관련 상황이 온다면 어떻게 하시겠어요?','가상 상황']];
  const tagCls={'의지·태도':'qtag-attitude','의지 확인':'qtag-attitude','태도 확인':'qtag-attitude','가치관':'qtag-value','가상 상황':'qtag-scen'};
  return qs.map(q=>`<div class="q"><span class="qtag ${tagCls[q[1]]||'qtag-explore'}">${q[1]}</span>${q[0]}</div>${ansBoxes(q[0],q[1])}`).join('');
}
// 한 역량을 "풀세트 카드"로 (핵심 역량 섹션용) — 좌: 라벨·역량명·등급 / 우: 설명·근거·질문
function coreCard(r){

    desc='역량검사 대비 AI 인터뷰에서 높게 평가된 역량입니다. 답변의 진위와 실제 보유 수준을 꼬리 질문으로 추적하세요.';
    const v=VULN[r.name]?`<div class="vuln"><span class="vuln-lb">AI 인터뷰</span><div class="vuln-txt">${VULN[r.name]}</div></div>`:'';
    right=`${v}${deepQA(r)}`;
  }else if(pk==='explore'){
    desc='역량검사는 우수하나 AI 인터뷰가 부족한 역량입니다. 추천 질문으로 발현 가능성을 확인하세요.';
    const ev=VULN_EXP[r.name]||(r.iv==='N'?'해당 역량에 대한 발화가 확인되지 않아 AI 인터뷰 기반 판단이 어렵습니다.':'AI 인터뷰 답변에서 이 역량을 뒷받침하는 근거가 충분히 드러나지 않았습니다.');

    const c=(PREDICT[r.name]&&PREDICT[r.name].verify)||'두 전형에서 일관되게 높은 수준을 보여 실무에서 안정적으로 발휘될 것으로 예측됩니다.';

  }else if(pk==='weak'){

    right=`<div class="cmt">${c}</div>`;
  }else{
    // 기타 역량(보통·진단불가): 코멘트 없이 등급만
    desc=''; right='';
  }
  return `<div class="core-item ${pk}">
    <div class="core-top">
      <div class="core-title">
        <span class="catchip ${labClass[pk]}">${r.pat.label}</span>
        <span class="core-cap">${r.name}</span>

    </div>
    <div class="core-body">${right}</div>
  </div>`;
}

/* ===== 페이지네이터 (역량 단위 · 상단부터 채움) ===== */
const doc=document.getElementById('doc');
const HEADER_HTML=`<div class="doc-top"><h1>2026_무하유_서비스기획자_채용</h1><div class="cand">몬스터 × 역량검사 교차진단 &nbsp;|&nbsp; <b>홍길동</b> · MUHA0001</div></div>`;
function makePage(first){
  const p=document.createElement('div'); p.className='page';
  p.innerHTML=HEADER_HTML+`<div class="pcontent"></div><div class="foot"><span class="brand">PRISM × <span>monster</span> 교차진단</span><span class="foot-c"><span>Copyright © 2026 muhayu Inc. All rights reserved.</span><span class="foot-ip">본 결과의 평가 기준, 문항, 분석 내용 등 모든 지적재산권은 ㈜무하유에 귀속됩니다. 무단 복제 및 재배포를 금합니다.</span></span><span class="pnum"></span></div>`;
  doc.appendChild(p); return p;
}
let page=makePage(true), content=page.querySelector('.pcontent');
const MAXBOT=1076;
function contentBottom(){ const k=content.children; if(!k.length) return content.getBoundingClientRect().top; return k[k.length-1].getBoundingClientRect().bottom; }
function overflow(){ return contentBottom() - page.getBoundingClientRect().top > MAXBOT; }
function kidsFrom(html){ const w=document.createElement('div'); w.innerHTML=html.trim(); return [...w.children]; }
units.forEach(u=>{
  const kids=kidsFrom(u.html);
  kids.forEach(k=>{ k.dataset.t=u.t; content.appendChild(k); });
  if(overflow()){
    kids.forEach(k=>content.removeChild(k));
    const carry=[];
    while(content.lastElementChild && content.lastElementChild.dataset.t==='title'){ carry.unshift(content.removeChild(content.lastElementChild)); }
    page=makePage(false); content=page.querySelector('.pcontent');
    carry.forEach(k=>content.appendChild(k));
    kids.forEach(k=>content.appendChild(k));
  }
});
const allPages=[...doc.querySelectorAll('.page')];
allPages.forEach((p,i)=>{ const pn=p.querySelector('.pnum'); if(pn) pn.textContent=`${i+1} / ${allPages.length}`; });
